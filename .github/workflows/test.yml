name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.4

      - name: Install Dependencies
        run: bun install

      - name: Install Server Dependencies
        run: bun install
        working-directory: server

      - name: Run Tests
        run: bun test